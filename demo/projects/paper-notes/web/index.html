<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>便签纸 · 在线体验</title>
    <link rel="icon" href="./icon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <p class="eyebrow">Fennec Share 示例包</p>
        <h1>便签纸</h1>
        <p class="lead">写下三件事，勾掉一件。内容只保存在你当前浏览器里（localStorage）。</p>
      </header>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr" for="note">新的便签</label>
        <input id="note" name="note" maxlength="80" placeholder="例如：给发布脚本补一条测试" required />
        <button type="submit">添加</button>
      </form>

      <ul class="notes" id="notes"></ul>
      <p class="empty" id="empty" hidden>还是没有便签，先加一条吧。</p>

      <footer class="foot">
        <span id="counter">0 / 0 已完成</span>
        <button class="link" id="reset" type="button">清空</button>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
